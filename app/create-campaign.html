<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Campaign | Brain Africa Labs</title><link rel="stylesheet" href="css/app.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><img src="../assets/logo.png"><span>Brain Africa Labs<small>AI Marketing Brain</small></span></a><a class="btn btn-ghost" href="dashboard.html">← Dashboard</a></header><main class="main narrow"><div class="steps"><div class="step active">1. Campaign</div><div class="step">2. Video</div><div class="step">3. TikTok</div><div class="step">4. Publish</div></div><div class="card"><div class="eyebrow">Step 1 of 4</div><h1 class="title">Create campaign</h1><p class="subtitle">Set the campaign context before selecting the video and publishing account.</p><form id="campaignForm" class="form" style="margin-top:24px"><div class="field"><label>Campaign name</label><input id="name" required value="Mangeons TikTok Campaign"></div><div class="field"><label>Objective</label><select id="objective"><option>Brand awareness</option><option>Product promotion</option><option>Engagement</option></select></div><div class="field"><label>Main platform</label><select id="platform"><option value="tiktok">TikTok</option></select></div><div class="field"><label>Campaign context</label><textarea id="brief">Promote Mangeons meals with a short vertical video for professionals in Abidjan.</textarea></div><div class="actions"><button class="btn btn-primary" type="submit">Continue to video →</button></div></form></div></main><script src="../app/config.js"></script><script src="js/app.js"></script><script>document.getElementById('campaignForm').addEventListener('submit',e=>{e.preventDefault();BAL.store.set('campaign',{name:document.getElementById('name').value,objective:document.getElementById('objective').value,platform:'tiktok',brief:document.getElementById('brief').value});BAL.go('select-video.html')})</script></body></html>
