<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review & Publish | Brain Africa Labs</title><link rel="stylesheet" href="css/app.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><img src="../assets/logo.png"><span>Brain Africa Labs<small>AI Marketing Brain</small></span></a><a class="btn btn-ghost" href="compose-post.html">← Back</a></header><main class="main narrow"><div class="card"><div class="eyebrow">Final review</div><h1 class="title">Review & publish</h1><div id="review" style="margin-top:20px"></div><div class="notice" style="margin-top:18px">When you click Publish, Brain Africa Labs sends the authorized publishing request to the backend integration. TikTok remains the system that controls final publication eligibility.</div><div class="actions" style="margin-top:24px"><button id="publish" class="btn btn-primary">Publish to TikTok</button></div></div></main><div id="toast" class="toast"></div><script src="../app/config.js"></script><script src="js/app.js"></script><script>const c=BAL.store.get('campaign',{}),v=BAL.store.get('video',{}),p=BAL.store.get('post',{});document.getElementById('review').innerHTML='<div class="review-row"><span>Campaign</span><strong>'+BAL.escape(c.name||'Mangeons TikTok Campaign')+'</strong></div><div class="review-row"><span>Video</span><strong>'+BAL.escape(v.name||BAL.config.demo.sampleVideoName)+'</strong></div><div class="review-row"><span>TikTok account</span><strong>Mangeons Official</strong></div><div class="review-row"><span>Privacy</span><strong>'+BAL.escape(p.privacy||'SELF_ONLY')+'</strong></div><div class="review-row"><span>Caption</span><strong>'+BAL.escape(p.caption||'')+'</strong></div>';document.getElementById('publish').onclick=()=>{BAL.store.set('publishRequest',{campaign:c,video:v,post:p});BAL.go('publishing.html')}</script></body></html>
