<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publishing | Brain Africa Labs</title><link rel="stylesheet" href="css/app.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><img src="../assets/logo.png"><span>Brain Africa Labs<small>AI Marketing Brain</small></span></a></header><main class="center"><div class="card narrow"><div class="eyebrow">Publishing</div><h1 class="title">Sending content to TikTok</h1><p id="msg" class="muted">Preparing the authorized request…</p><div class="progress" style="margin:22px 0"><span id="bar"></span></div><div id="result" class="notice">The application is waiting for the backend response.</div></div></main><script src="../app/config.js"></script><script src="js/app.js"></script><script>const req=BAL.store.get('publishRequest',{}),bar=document.getElementById('bar'),msg=document.getElementById('msg'),result=document.getElementById('result');let pct=10;const timer=setInterval(()=>{pct=Math.min(pct+10,80);bar.style.width=pct+'%';},350);async function run(){try{const endpoint=BAL.endpoint('publish');if(!endpoint||endpoint.endsWith('/'))throw new Error('publish endpoint is not configured');msg.textContent='Submitting the request to the publishing backend…';const data=await BAL.post(endpoint,req);clearInterval(timer);bar.style.width='100%';BAL.store.set('publishResult',data);setTimeout(()=>location.href='publish-success.html',400)}catch(e){clearInterval(timer);bar.style.width='100%';msg.textContent='The backend did not return a successful publishing response.';result.innerHTML='<span class="status error">Error</span><p>'+BAL.escape(e.message)+'</p><p class="muted">Configure app/config.js with the real n8n publish webhook. Do not expose TikTok client secrets in the browser.</p>'}}run()</script></body></html>
